editor.hint.select=Click a territory to select it. Drag its white points to reshape it (shared borders move together, Alt moves one only). Double click a border to add a point, right click a point to remove it. Drag the round marker to move the armies. Wheel zooms, Space + drag pans, Ctrl+Z undoes.
editor.hint.draw=Click to add points; points snap to nearby borders so neighbours share them. Click the first point or press Enter to close. Right click or Backspace removes the last point, Esc cancels.
editor.hint.part=Draws another piece (for example an island) of the selected territory. Click the first point or press Enter to close.
editor.hint.partfirst=Select the territory first, then draw its new part.
editor.hint.connect=Click the territory to connect from, then click others to connect or disconnect them (click it again to finish). Use it for sea routes between territories that do not touch.
editor.hint.label=Click inside a territory to put its armies there.
editor.hint.minvertices=A part needs at least 3 points.
