editor.hint.select=Pincha en un territorio para seleccionarlo. Arrastra sus puntos blancos para darle forma (las fronteras compartidas se mueven juntas, Alt mueve solo uno). Doble clic en un borde a\u00F1ade un punto, clic derecho en un punto lo quita. Arrastra el marcador redondo para mover las tropas. La rueda hace zoom, Espacio + arrastrar mueve la vista, Ctrl+Z deshace.
editor.hint.draw=Haz clic para a\u00F1adir puntos; se pegan a las fronteras cercanas para compartirlas con los vecinos. Pincha el primer punto o pulsa Enter para cerrar. Clic derecho o Retroceso quita el \u00FAltimo punto, Esc cancela.
